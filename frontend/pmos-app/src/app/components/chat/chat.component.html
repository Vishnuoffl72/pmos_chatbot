<div class="chat-wrapper">
  <div class="chat-container">
    <div class="chat-header">
      <h2>PMOS Assistant</h2>
      <p>Ask anything about PMOS health</p>
    </div>

    <div class="chat-messages" #scrollMe>
      <div *ngFor="let msg of messages" [ngClass]="['message-wrapper', msg.sender]">
        <div class="avatar" *ngIf="msg.sender === 'bot'">🤖</div>
        <div class="message-bubble">{{ msg.text }}</div>
        <div class="avatar" *ngIf="msg.sender === 'user'">👤</div>
      </div>

      <div class="message-wrapper bot" *ngIf="isLoading">
        <div class="avatar">🤖</div>
        <div class="message-bubble typing">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>

    <div class="suggestions" *ngIf="messages.length === 1">
      <button *ngFor="let suggestion of suggestions" (click)="sendSuggestion(suggestion)" class="suggestion-chip">
        {{ suggestion }}
      </button>
    </div>

    <div class="chat-input-area">
      <input 
        type="text" 
        [(ngModel)]="userInput" 
        (keyup.enter)="sendMessage()"
        placeholder="Type your message here..."
        [disabled]="isLoading"
      />
      <button (click)="sendMessage()" [disabled]="isLoading || !userInput.trim()">
        Send
      </button>
    </div>
  </div>
</div>
